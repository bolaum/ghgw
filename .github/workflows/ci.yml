name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run 'make fmt'. Files not formatted:"
            echo "$unformatted"
            exit 1
          fi
      - run: make vet
      - run: make lint
      - run: make test
      - name: build and check that ldflags reach the binary
        run: |
          make build VERSION=v0.0.0-ci COMMIT=0123abc DATE=2026-01-02T03:04:05Z
          want='{"version":"v0.0.0-ci","commit":"0123abc","date":"2026-01-02T03:04:05Z"}'
          got=$(bin/ghgw version --json)
          if [ "$got" != "$want" ]; then
            echo "bin/ghgw version --json: got $got, want $want"
            exit 1
          fi
